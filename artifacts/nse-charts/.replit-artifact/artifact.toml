kind = "web"
previewPath = "/"
title = "NSE PDF Chart Generator"
version = "1.0.0"
id = "artifacts/nse-charts"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21854

[services.development]
run = "pnpm --filter @workspace/nse-charts run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nse-charts", "run", "build" ]
publicDir = "artifacts/nse-charts/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21854"
BASE_PATH = "/"
