openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NSE PDF Chart Generator API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: jobs
    description: PDF generation jobs
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List all generation jobs
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  /jobs/generate-all:
    post:
      operationId: generateAllNse
      tags: [jobs]
      summary: Start generating PDF for all NSE stocks
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateAllRequest"
      responses:
        "202":
          description: Job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/parse-csv:
    post:
      operationId: parseCsv
      tags: [jobs]
      summary: Parse uploaded CSV file and return stock list with date range
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Parsed CSV result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvParseResult"
        "400":
          description: Invalid CSV

  /jobs/generate-csv:
    post:
      operationId: generateFromCsv
      tags: [jobs]
      summary: Generate PDF for selected stocks from CSV with date range
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCsvRequest"
      responses:
        "202":
          description: Job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{jobId}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get job status and progress
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Job not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Job:
      type: object
      properties:
        jobId:
          type: string
        type:
          type: string
          enum:
            - all-nse
            - csv
        status:
          type: string
          enum:
            - pending
            - running
            - completed
            - failed
        progress:
          type: integer
        total:
          type: integer
        message:
          type: string
        createdAt:
          type: string
        completedAt:
          type: ["string", "null"]
        stockCount:
          type: ["integer", "null"]
      required:
        - jobId
        - type
        - status
        - progress
        - total
        - message
        - createdAt
        - completedAt
        - stockCount

    GenerateAllRequest:
      type: object
      properties:
        historyMonths:
          type: integer
          default: 6
        letterFilter:
          type: string
          description: "Filter stocks by starting letter range e.g. 'A-D' or 'ALL'"
          default: "ALL"

    CsvParseResult:
      type: object
      properties:
        stocks:
          type: array
          items:
            type: string
        stocksByDate:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        dates:
          type: array
          items:
            type: string
        minDate:
          type: string
        maxDate:
          type: string
        totalRows:
          type: integer
      required:
        - stocks
        - stocksByDate
        - dates
        - minDate
        - maxDate
        - totalRows

    GenerateCsvRequest:
      type: object
      properties:
        stocks:
          type: array
          items:
            type: string
        startDate:
          type: string
        endDate:
          type: string
        historyMonths:
          type: integer
          default: 6
      required:
        - stocks
        - startDate
        - endDate
